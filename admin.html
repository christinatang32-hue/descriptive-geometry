<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教师学情统计 · 画法几何及工程制图</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#173240;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1150px;margin:auto;padding:32px 24px}a{color:#0a7775}header{border-bottom:1px solid #cedbd8;padding-bottom:20px}h1{font-size:30px;margin:8px 0}h2{font-size:21px;margin:0 0 10px}p{color:#58707b}.panel{background:#fff;border:1px solid #d9e3e0;border-radius:12px;padding:24px;margin-top:24px}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-weight:700}input{display:block;width:min(100%,360px);height:42px;margin-top:6px;padding:0 12px;border:1px solid #b9ceca;border-radius:7px}input[type=file]{padding:8px;height:auto}button{border:0;background:#0a7775;color:#fff;border-radius:7px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}button.secondary{background:#e4f0ed;color:#0a6967}.error{color:#ac3529;min-height:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.metric{padding:17px;background:#f2f8f6;border-radius:9px}.metric b{display:block;font-size:27px;color:#0a7775}.metric span{color:#536c75}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e2eae8}th{background:#f5f9f8;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}.empty{text-align:center;color:#607782;padding:30px}.muted{color:#647b82;font-size:13px}.cohorts{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none}.cohorts li{background:#e8f3f0;border-radius:20px;padding:6px 12px;color:#24565b}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #25a7a3;outline-offset:2px}@media(max-width:700px){main{padding:20px 14px}h1{font-size:24px}.cards{grid-template-columns:1fr}form{display:block}form button{margin-top:10px}}
  </style>
  <script defer src="config.js"></script><script defer src="vendor/xlsx.full.min.js"></script><script defer src="admin.js"></script>
</head>
<body><main>
  <header><a href="index.html">← 返回课堂</a><h1>教师学情统计</h1><p>记录仅统计页面在前台且未闲置的有效学习时长；学号和姓名与教师上传名单核对，但不能防止他人代填。</p></header>
  <section class="panel"><form id="access"><label for="token">教师访问密钥<input id="token" type="password" autocomplete="off" required placeholder="仅在本次页面中使用"></label><button id="load" type="submit">查看统计</button><button id="export" type="button" class="secondary" disabled>导出 CSV</button></form><p class="error" id="error" role="alert"></p><p class="muted">访问密钥不写入网页或浏览器存储。每次学习记录自登录起保留三年，过期自动删除。</p></section>
  <section class="panel"><h2>上传学生名单</h2><p>直接上传 Excel 文件（.xlsx 或 .xls），表格包含“学号、姓名”两列；可有标题行和其他列。<button id="download-template" type="button" class="secondary">下载 Excel 模板</button>。上传只允许持有教师密钥的人操作；重复上传同一学号会更新姓名与届别。</p><form id="roster-form"><label for="cohort">届别或班级<input id="cohort" required maxlength="40" placeholder="例如：2026级土木1班"></label><label for="roster-file">名单 Excel<input id="roster-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" required></label><button id="roster-upload" type="submit">核对并上传</button></form><p id="roster-status" role="status"></p><ul class="cohorts" id="cohort-list" aria-label="已上传名单"></ul></section>
  <section class="panel" id="result" hidden><h2>学习情况</h2><div class="cards"><div class="metric"><b id="students">0</b><span>学习人数</span></div><div class="metric"><b id="sessions">0</b><span>登录次数</span></div><div class="metric"><b id="duration">0 分钟</b><span>累计有效时长</span></div></div><div class="table-wrap"><table><thead><tr><th>届别 / 班级</th><th>学号</th><th>姓名</th><th class="num">登录次数</th><th class="num">讲义</th><th class="num">例题</th><th class="num">作业</th><th class="num">总时长</th><th>最近学习</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></body></html>
