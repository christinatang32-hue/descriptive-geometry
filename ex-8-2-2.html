<script id="lesson-data" type="application/json">{"problem":"根据形体的投影图和轴测图，求作 1—1 剖面图、2—2 半剖面图。材料为金属。"}</script>
<script>
(()=>{
  'use strict';
  const G={"length":300,"width":201,"height":249,"floor":30,"shoulder":200,"notchFloor":230,"lowerInset":30,"upperInset":59,"notchInset":79,"wallThickness":30.5,"measurement":{"source":"空白作业/8.2-1&2.jpg","unit":"相对制图单位，正面投影总长取 300","imageCropOrigin":[1535,980],"elevation":{"outerX":[153.5,607],"lowerX":[198.5,562],"upperX":[241.5,517],"notchX":[272.5,486],"heightY":[433.5,388.5,131.5,86.5,56.5]},"plan":{"outerX":[154,605.5],"wallY":[605.5,651.5,863,908.5],"cutX":377.5,"cutY":757}}};
  const {length:L,width:W,height:H,floor:F,shoulder:S,notchFloor:N,
    lowerInset:A,upperInset:B,notchInset:C,wallThickness:T}=G;
  const midX=L/2,midY=W/2;
  const fullStep=2,halfStep=4;
  const steps=[
    {title:'读题',action:'对照两面投影和轴测图，找出底板、下宽上窄的内腔，以及前后壁顶缘中央的凹槽。台肩下沿和凹槽底在不同高程。以下按题图比例转移尺寸。'},
    {title:'判定剖切位置和视向',action:'1. 1—1 通过前后中点，由水平投影的下方向上观察。\n2. 2—2 通过左右中点，由水平投影的右方向左观察。侧向投影的左半画外观，右半画剖面。'},
    {title:'绘制1-1轮廓线',short:'绘制1-1轮廓线',action:'先用细实线绘制出所有的轮廓线。\n1. 量取总长，从左向右画底边。由底边左端向上转移总高，画左竖线。量取上边总长，用绿色细实线从左向右一笔画出整条上边。直接连接上下两边的右端，画右竖线。\n2. 转移内腔底面和台肩高程，先从左向右画各段水平线，再由已画竖线量取水平距离，从相接的水平线向下画内腔竖线。\n3. 绘制顶口时保留上边作图线。先从左向右画槽底水平线，再依次定位左、右竖线，并由上边向下画到槽底。'},
    {title:'填充金属图例',short:'填充金属图例',action:'保留 1—1 的轮廓和定位作图线，在切到的金属范围内填充等距的 45° 连续细实线。'},
    {title:'绘制2-2轮廓线',short:'绘制2-2轮廓线',action:'先用细实线绘制出所有的轮廓线。\n1. 从水平投影向两侧转移半宽，从左向右画底边。由底边左端向上转移总高，画左竖线。量取上边总宽，从左向右跨过对称轴一次画全。直接连接上下两边的右端，画右竖线。\n2. 保留外框和已有作图线。量取后壁厚度，转移内腔底面、台肩和槽底的高程，从左向右画水平内边线，再从上边向下补画后壁内缘。'},
    {title:'填充金属图例',short:'填充金属图例',action:'保留两图已有的轮廓和作图线。在 2—2 右半切到的金属范围内填充等距的 45° 连续细实线。'},
    {title:'加粗结果并核对',short:'加粗结果并核对',action:'清除定位作图线和跨过 1—1 顶口的临时线段。本题取 b = 0.8 mm。切到的轮廓用 0.7b 中粗实线（0.56 mm），未切到的可见轮廓用 0.5b 中实线（0.40 mm）。核对两图的底板、台肩、槽底高程和 2—2 的对称符号。'}
  ];
  const $=id=>document.getElementById(id),diagram=$('diagram'),scene=$('scene');
  const media=matchMedia('(max-width: 750px)'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const wide={size:[1092,652],front:[91,306],plan:[91,388],full:[455,306],half:[818,306],axon:[635,598]};
  const narrow={size:[818,961],front:[96,301],plan:[96,392],full:[487,301],half:[544,650],axon:[294,905]};
  let layout=media.matches?narrow:wide;
  let step=0,phase=0,playing=false,stepTimer=0,playTimer=0,zoom=1,panX=0,panY=0,diagramDrag=null;
  const n=v=>Math.round(v*100)/100;
  const xy=([x,y])=>`${n(x)} ${n(y)}`;
  const line=(a,b,cls)=>`<line class="${cls}" x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}"/>`;
  const path=(d,cls)=>`<path class="${cls}" d="${d}"/>`;
  const trace=(points,close=false)=>'M'+points.map(xy).join(' L')+(close?' Z':'');
  const txt=([x,y],label,cls='',anchor='start')=>`<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${label}</text>`;
  const elevation=(view,[x,z])=>[layout[view][0]+x,layout[view][1]-z];
  const plan=([x,y])=>[layout.plan[0]+x,layout.plan[1]+y];
  function viewPoint(view,point){return view==='plan'?plan(point):elevation(view,point)}
  const viewLine=(view,a,b,cls)=>line(viewPoint(view,a),viewPoint(view,b),cls);
  const viewPath=(view,points,cls,close=false)=>path(trace(points.map(point=>viewPoint(view,point)),close),cls);
  const frontOutline=[[0,0],[L,0],[L,H],[L-C,H],[L-C,N],[C,N],[C,H],[0,H]];
  const cavityOutline=[[B,H],[B,S],[A,S],[A,F],[L-A,F],[L-A,S],[L-B,S],[L-B,H]];
  const fullBoundary=[[0,H],[0,0],[L,0],[L,H],...cavityOutline.slice().reverse()];
  const fullBehind=[[B,H],[C,H],[C,N],[L-C,N],[L-C,H],[L-B,H]];
  const halfBoundary=[[midY,0],[W,0],[W,N],[W-T,N],[W-T,F],[midY,F]];
  const halfBehind=[[[W,N],[W,H]],[[W-T,N],[W-T,H]],[[midY,S],[W-T,S]]];
  const halfTop=[[0,H],[W,H]];
  const halfExterior=[[[0,0],[midY,0]],[[0,H],[0,0]],halfTop];
  const planTop=[[B,T],[L-B,T],[L-B,W-T],[B,W-T]];

  function givenViews(){
    let out=viewPath('front',frontOutline,'given',true)+viewPath('front',cavityOutline,'hidden-line');
    out+=viewPath('plan',[[0,0],[L,0],[L,W],[0,W]],'given',true)+viewPath('plan',planTop,'given',true);
    for(const [x,upper] of [[A,B],[L-A,L-B]]){
      out+=viewPath('plan',[[upper,T],[x,T],[x,W-T],[upper,W-T]],'hidden-line');
    }
    for(const x of [C,L-C]){
      out+=viewLine('plan',[x,0],[x,T],'given')+viewLine('plan',[x,W-T],[x,W],'given');
    }
    const active=step===1?(phase===0?1:2):step===fullStep?1:step===halfStep?2:0;
    out+=viewLine('plan',[-18,midY],[L+18,midY],active===1?'axis-line cut-active':'axis-line');
    out+=viewLine('plan',[midX,-18],[midX,W+18],active===2?'axis-line cut-active':'axis-line');
    for(const [x,inward] of [[-47,1],[L+47,-1]]){
      out+=viewPath('plan',[[x,midY-19],[x,midY],[x+inward*21,midY]],'given cut-symbol');
      out+=txt(plan([x,midY-25]),'1','','middle');
    }
    for(const [y,inward] of [[-47,1],[W+47,-1]]){
      out+=viewPath('plan',[[midX+21,y],[midX,y],[midX,y+inward*21]],'given cut-symbol');
      out+=txt(plan([midX+30,y+5]),'2');
    }
    return out;
  }

  const mark=(view,a,b,side=1)=>({view,a,b,side});
  const edge=(view,a,b)=>({view,a,b});
  const heightMeasure=(view,x,z)=>mark(view,[x,0],[x,z],-1);
  const horizontal=(view,z,left,right)=>edge(view,[left,z],[right,z]);
  const vertical=(view,x,from,to)=>edge(view,[x,from],[x,to]);
  const pointGuide=(view,x,top)=>({view,a:[x,top+10],b:[x,top],point:true});
  const levelGuide=(view,z)=>({view,a:[-6,z],b:[(view==='full'?L:W)+6,z]});
  const axon1=(a,b)=>[a,b].map(([x,z])=>[x,midY,z]);
  function transferHeight(view,x,z,axon){
    return {source:heightMeasure('front',x,z),target:heightMeasure(view,-16,z),guide:levelGuide(view,z),axon};
  }
  function fullVertical(x,top,bottom,from,depth=T){
    const z=top+10;
    return {source:mark('plan',[from,depth],[x,depth],from<x?-1:1),
      target:mark('full',[from,z],[x,z],from<x?-1:1),guide:pointGuide('full',x,top),
      axon:[[from,depth,top],[x,depth,top]],edge:vertical('full',x,top,bottom)};
  }
  function halfOffset(x,from,top){
    const z=top+10;
    return {source:mark('plan',[L,W-from],[L,W-x],x<from?-1:1),
      target:mark('half',[from,z],[x,z],x<from?1:-1)};
  }
  const operations={
    [fullStep]:[
      {source:mark('front',[0,0],[L,0]),target:mark('full',[0,-10],[L,-10]),
        edge:horizontal('full',0,0,L),axon:axon1([0,0],[L,0])},
      {source:heightMeasure('front',0,H),target:heightMeasure('full',-16,H),
        axon:axon1([0,0],[0,H]),edge:vertical('full',0,0,H)},
      {source:mark('front',[0,H+10],[L,H+10],-1),target:mark('full',[0,H+10],[L,H+10],-1),
        axon:axon1([0,H],[L,H]),edge:horizontal('full',H,0,L),topLevel:true},
      {edge:vertical('full',L,H,0)},
      {...transferHeight('full',B,S,axon1([B,0],[B,S])),edge:horizontal('full',S,A,B)},
      {...transferHeight('full',A,F,axon1([A,0],[A,F])),edge:horizontal('full',F,A,L-A)},
      {edge:horizontal('full',S,L-B,L-A)},
      fullVertical(A,S,F,0),
      fullVertical(B,H,S,A),
      fullVertical(L-B,H,S,L),
      fullVertical(L-A,S,F,L-B),
      {source:mark('front',[C,H],[C,N],1),target:mark('full',[C-12,H],[C-12,N],1),
        guide:levelGuide('full',N),axon:[[C,0,H],[C,0,N]],edge:horizontal('full',N,C,L-C)},
      fullVertical(C,H,N,B),
      fullVertical(L-C,H,N,L-B)
    ],
    [halfStep]:[
      {source:mark('plan',[L,midY],[L,W]),target:mark('half',[midY,-10],[0,-10],-1)},
      {source:mark('plan',[L,midY],[L,0]),target:mark('half',[midY,-10],[W,-10]),
        edge:horizontal('half',0,0,W)},
      {source:heightMeasure('front',0,H),target:heightMeasure('half',-16,H),edge:vertical('half',0,0,H)},
      {source:mark('plan',[L,W],[L,0],1),target:mark('half',[0,H+10],[W,H+10],-1),edge:edge('half',...halfTop)},
      {edge:vertical('half',W,H,0)},
      {...halfOffset(W-T,W,H),guide:pointGuide('half',W-T,H)},
      {...transferHeight('half',A,F),edge:horizontal('half',F,midY,W-T)},
      {...transferHeight('half',B,S),edge:horizontal('half',S,midY,W-T)},
      {...transferHeight('half',midX,N),edge:horizontal('half',N,W-T,W)},
      {...halfOffset(W-T,W,H),edge:vertical('half',W-T,H,F)}
    ]
  };

  function brace(a,b,side){
    const dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy);
    const at=(t,offset)=>xy([a[0]+t*dx-side*offset*dy/length,a[1]+t*dy+side*offset*dx/length]);
    const tip=Math.min(.22,12/length);
    return path(`M${at(0,4)} C${at(0,10)} ${at(tip/2,10)} ${at(tip,10)} L${at(.5-tip,10)} `+

    ctx.lineCap='butt';ctx.lineWidth=1.26;ctx.strokeStyle='#3c6565';
    strokeSegments(mesh.edges,faces,project);
    if(showPlanes){
      ctx.setLineDash([5,4]);ctx.strokeStyle='#198681';ctx.lineWidth=1.1;
      const planes=camera.cut===1?[plane1]:quarterPlanes;
      const edges=planes.flatMap(plane=>plane.map((a,index)=>({a,b:plane[(index+1)%4],part:0,adjacent:[]})));
      strokeSegments(edges,faces,project);ctx.setLineDash([]);
    }
    if(camera.opening>.035){
      ctx.fillStyle='#0b6f6b';ctx.font='bold 12px Microsoft YaHei';
      ctx.fillText(camera.cut===1?'1—1 全剖':'2—2 半剖',10,19);
    }
  }
  function requestDraw(){
    if(!drawFrame)drawFrame=requestAnimationFrame(()=>{drawFrame=0;drawModel()});
  }
  function updateModelControls(){
    $('openRange').value=String(Math.round(camera.opening*100));
    $('openValue').textContent=camera.opening===0?'合拢':camera.opening===1?'剖开':`${Math.round(camera.opening*100)}%`;
    $('openModel').textContent=animationTarget!==null?'暂停动画':camera.opening>.5?'播放合拢动画':'播放剖开动画';
    $('cutFull').setAttribute('aria-pressed',String(camera.cut===1));
    $('cutHalf').setAttribute('aria-pressed',String(camera.cut===2));
  }
  function stopModel(){animation++;animationTarget=null;showPlanes=false}
  function resetCamera(){
    Object.assign(camera,{yaw:defaultYaw[camera.cut],pitch:defaultPitch,zoom:1,x:0,y:0});
  }
  function resetModel(){stopModel();camera.opening=0;resetCamera();updateModelControls();requestDraw()}
  function setCut(cut){
    if(camera.cut===cut)return;
    camera.cut=cut;resetModel();
  }
  function animateModel(target){
    const token=++animation,start=camera.opening,started=performance.now();
    const duration=reduced.matches?0:1000;
    const intro=target===1&&start===0&&duration ? .22 : 0;
    animationTarget=target;updateModelControls();
    function frame(now){
      if(token!==animation)return;
      const fraction=duration?clamp((now-started)/duration,0,1):1;
      showPlanes=fraction<intro;
      const t=clamp((fraction-intro)/(1-intro),0,1);
      camera.opening=start+(target-start)*(t*t*(3-2*t));
      if(fraction<1)requestAnimationFrame(frame);
      else animationTarget=null;
      updateModelControls();requestDraw();
    }
    requestAnimationFrame(frame);
  }
  $('cutFull').addEventListener('click',()=>setCut(1));
  $('cutHalf').addEventListener('click',()=>setCut(2));
  $('openModel').addEventListener('click',()=>{
    if(animationTarget!==null){stopModel();updateModelControls();requestDraw();return}
    animateModel(camera.opening>.5?0:1);
  });
  $('openRange').addEventListener('input',event=>{
    stopModel();camera.opening=Number(event.target.value)/100;updateModelControls();requestDraw();
  });
  function modelMode(mode){
    camera.mode=mode;
    $('rotateMode').setAttribute('aria-pressed',String(mode==='rotate'));
    $('panMode').setAttribute('aria-pressed',String(mode==='pan'));
  }
  $('rotateMode').addEventListener('click',()=>modelMode('rotate'));
  $('panMode').addEventListener('click',()=>modelMode('pan'));
  $('modelReset').addEventListener('click',()=>{resetCamera();requestDraw()});
  function pointerDistance(){const [a,b]=pointers.values();return Math.hypot(a.x-b.x,a.y-b.y)}
  function cameraZoom(factor){camera.zoom=clamp(camera.zoom*factor,.54,3);requestDraw()}
  stage.addEventListener('pointerdown',event=>{
    if(pointers.size>=2)return;
    const point={x:event.clientX,y:event.clientY};
    pointers.set(event.pointerId,point);stage.setPointerCapture(event.pointerId);
    if(pointers.size===2){pinchDistance=pointerDistance();modelDrag=null}
    else modelDrag={...point,mode:event.shiftKey?'pan':camera.mode};
  });
  stage.addEventListener('pointermove',event=>{
    if(!pointers.has(event.pointerId))return;
    const point={x:event.clientX,y:event.clientY};pointers.set(event.pointerId,point);
    if(pointers.size===2){
      const distance=pointerDistance();
      if(distance>0&&pinchDistance>0)cameraZoom(distance/pinchDistance);
      pinchDistance=distance;return;
    }
    if(!modelDrag)return;
    const dx=point.x-modelDrag.x,dy=point.y-modelDrag.y;
    if(modelDrag.mode==='pan'){camera.x+=dx;camera.y+=dy}
    else{camera.yaw+=dx*.008;camera.pitch+=dy*.008}
    Object.assign(modelDrag,point);requestDraw();
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,event=>{
    if(!pointers.delete(event.pointerId))return;
    const [point]=pointers.values();modelDrag=point?{...point,mode:camera.mode}:null;
  });
  stage.addEventListener('wheel',event=>{event.preventDefault();cameraZoom(event.deltaY<0?1.11:1/1.11)},{passive:false});
  stage.addEventListener('keydown',event=>{
    const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
    const move=moves[event.key];
    if(!move)return;
    event.preventDefault();
    const [x,y]=move;
    if(event.shiftKey){camera.x+=x*16;camera.y+=y*16}
    else{camera.yaw+=x*.12;camera.pitch+=y*.12}
    requestDraw();
  });
  media.addEventListener('change',()=>setLayout(media.matches?narrow:wide));
  if('ResizeObserver'in window)new ResizeObserver(requestDraw).observe(stage);
  else addEventListener('resize',requestDraw);
  setLayout(layout);setStep(0);updateModelControls();drawModel();
})();
</script>
</body>
</html>
