<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学生注册 · 画法几何及工程制图</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;color:#18243c;background:#fff;font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}
    main{min-height:100vh;display:grid;grid-template-columns:minmax(0,48fr) minmax(430px,52fr)}
    .art{position:relative;min-height:100vh;background:#e8edf3;overflow:hidden}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art span{position:absolute;left:38px;bottom:32px;padding:5px 9px;background:#f5f8fbdd;color:#173b61;font-size:19px;font-weight:800}
    .panel{display:flex;align-items:center;justify-content:center;padding:38px clamp(28px,5vw,80px);background:linear-gradient(145deg,#fff 35%,#f7faff 100%)}.content{width:min(100%,470px)}
    a{color:#2768e8;text-underline-offset:3px}h1{margin:10px 0 8px;font-size:30px;line-height:1.35}.intro{margin:0 0 22px;color:#53627a}
    label{display:block;margin:11px 0 0;font-weight:700;color:#52617b;font-size:13px}input{display:block;width:100%;height:44px;margin-top:5px;padding:0 13px;border:1px solid #d9e2ef;border-radius:7px;background:white;color:#18243c;font:15px "Microsoft YaHei",sans-serif}
    input:focus{border-color:#2768e8;outline:2px solid #a8c5ff}button{width:100%;height:46px;margin-top:22px;border:0;border-radius:7px;background:#2768e8;color:#fff;font:700 16px "Microsoft YaHei",sans-serif;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .error{min-height:21px;margin:8px 0 0;color:#b03232}.note{font-size:13px;color:#607187}.back{display:inline-block;margin-top:18px}
    .success{padding:20px;border-radius:9px;background:#eaf6ed;color:#215c35}.success h2{margin:0 0 7px;font-size:21px}.success p{margin:0}
    @media(max-width:800px){main{grid-template-columns:1fr}.art{min-height:220px}.art span{left:24px;bottom:20px;font-size:17px}.panel{padding:32px 24px 48px}}
  </style>
  <script defer src="config.js"></script>
</head>
<body>
<main>
  <div class="art"><img src="cover-architectural-drawing.png" alt="建筑模型与工程制图工作台"><span>空间形体 · 投影分析 · 工程表达</span></div>
  <section class="panel"><div class="content">
    <a href="index.html">← 返回登录</a>
    <h1>学生注册</h1>
    <p class="intro">首次使用时填写名单中的信息，核对通过后设置密码。</p>
    <form id="register-form">
      <label for="name">姓名<input id="name" autocomplete="name" maxlength="30" required></label>
      <label for="student-id">学号<input id="student-id" autocomplete="username" maxlength="24" inputmode="numeric" required></label>
      <label for="class-name">班级<input id="class-name" maxlength="40" required></label>
      <label for="password">设置密码<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
      <label for="confirm-password">再次输入密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
      <label for="phone">手机号<input id="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="11" required></label>
      <button id="submit" type="submit">核对名单并注册</button><p class="error" id="error" role="alert"></p>
    </form>
    <div class="success" id="success" hidden><h2>注册成功</h2><p>请返回登录页，使用学号、姓名和刚设置的密码登录。</p><a class="back" href="index.html">返回登录</a></div>
    <p class="note">手机号仅作为账号资料保存，当前不发送短信验证码，也无法根据教学系统名单验证号码归属。</p>
  </div></section>
</main>
<script>
(()=>{
  const $=id=>document.getElementById(id),form=$('register-form'),error=$('error'),button=$('submit');
  form.addEventListener('submit',async event=>{
    event.preventDefault();error.textContent='';
    const input={name:$('name').value.trim(),studentId:$('student-id').value.trim(),className:$('class-name').value.trim(),password:$('password').value,confirmPassword:$('confirm-password').value,phone:$('phone').value.trim()};
    if(input.password!==input.confirmPassword){error.textContent='两次输入的密码不一致。';return}
    if(input.password.length<10){error.textContent='密码至少需要 10 个字符。';return}
    if(!/^1[3-9]\d{9}$/.test(input.phone)){error.textContent='请输入 11 位中国大陆手机号。';return}
    button.disabled=true;
    try{
      if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
      const api=String(window.COURSE_CONFIG?.apiBase||'').replace(/\/$/,'');
      if(!api)throw Error('注册服务尚未加载，请刷新页面后重试。');
      const response=await fetch(api+'/api/student/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});
      if(response.status===403)throw Error('姓名、学号或班级与教师上传的名单不一致，不能注册。');
      if(response.status===409)throw Error('该学号已注册，请返回登录。');
      if(!response.ok)throw Error('注册服务暂不可用，请稍后重试。');
      form.hidden=true;$('success').hidden=false;
    }catch(cause){error.textContent=cause instanceof TypeError?'无法连接注册服务，请检查网络后重试。':cause.message||'注册失败。'}
    finally{button.disabled=false}
  });
})();
</script>
</body>
</html>
