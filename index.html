<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="《画法几何及工程制图》学习平台：讲义、例题与作业分步演示。">
  <title>《画法几何及工程制图》学习平台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{color-scheme:light;--ink:#18243c;--blue:#2768e8;--line:#d9e2ef}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}
    button,input{font:inherit}button{cursor:pointer}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #75a8ff;outline-offset:3px}
    .page,.frame,.cover{min-height:100vh;min-height:100svh}.frame{width:100%}
    .cover{display:grid;grid-template-columns:minmax(0,58fr) minmax(400px,42fr);background:#fff}
    .art{position:relative;min-height:100vh;min-height:100svh;background:#e8edf3;overflow:hidden}.art img{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center}
    .art::after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#f3f7f9a8)}
    .art-caption{position:absolute;z-index:1;left:48px;bottom:40px;padding:5px 9px;border-radius:4px;background:#f5f8fbcc;color:#173b61;font-size:19px;letter-spacing:.06em;font-weight:800;text-shadow:0 1px #fff}
    .panel{position:relative;display:flex;flex-direction:column;justify-content:center;padding:74px clamp(42px,5vw,90px);background:linear-gradient(145deg,#fff 35%,#f7faff 100%)}
    .course-title{margin:0 0 44px;font-size:clamp(24px,calc(1.8vw + 2px),32px);line-height:1.45;letter-spacing:0;font-weight:800;color:#10213e}.course-title span{display:inline}
    label{display:block;margin:12px 0 0;color:#52617b;font-size:13px;font-weight:700}
    input{display:block;width:100%;height:45px;margin-top:6px;padding:0 15px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);box-shadow:0 2px 4px #132b4410}
    input::placeholder{color:#a1aec1}input:focus{border-color:var(--blue)}
    .login-button{width:100%;height:46px;margin-top:20px;border:0;border-radius:7px;background:linear-gradient(90deg,#2f7af4,#245ce2);color:white;font-weight:800;letter-spacing:.08em;box-shadow:0 8px 18px #2867e835}
    .login-button:hover{filter:brightness(1.06)}.login-button:disabled{opacity:.7;cursor:wait}
    .error{min-height:20px;margin:7px 0 0;color:#b03232;font-size:13px}
    .register-row{margin:14px 0 0;text-align:center;color:#52617b}.register-row a{color:var(--blue);font-weight:700;text-underline-offset:3px}
    @media(max-width:800px){.cover{grid-template-columns:1fr}.art{min-height:34vh;min-height:34svh}.art-caption{left:24px;bottom:20px;font-size:17px}.panel{min-height:66vh;min-height:66svh;padding:52px clamp(26px,7vw,64px)}.course-title{margin-bottom:34px}}
    @media(max-width:480px){.art{min-height:240px}.panel{min-height:560px;padding:36px 26px}.course-title{font-size:24px;margin-bottom:27px}.course-title span{display:block}}
  </style>
  <script defer src="config.js"></script>
</head>
<body>
  <main class="page">
    <div class="frame">
      <div class="cover">
        <div class="art"><img src="cover-architectural-drawing.png" alt="建筑模型、工程图纸、三角尺和卷图组成的制图工作台"><div class="art-caption">空间形体 · 投影分析 · 工程表达</div></div>
        <section class="panel" aria-labelledby="course-title">
          <h1 class="course-title" id="course-title">《画法几何及工程制图》<span>学习平台</span></h1>
          <form id="login-form">
            <label for="student-id">学号/工号<input id="student-id" name="studentId" autocomplete="username" maxlength="24" required placeholder="请输入学号或工号"></label>
            <label for="student-name">姓名<input id="student-name" name="studentName" autocomplete="name" maxlength="30" required placeholder="请输入姓名"></label>
            <label for="login-password">密码<input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
            <button class="login-button" type="submit" id="login-button">登录</button>
            <p class="error" id="login-error" role="alert"></p>
          </form>
          <p class="register-row">学生首次使用？<a href="register.html">注册账号</a></p>
        </section>
      </div>
    </div>
  </main>
  <script>
  (()=>{
    const form=document.getElementById('login-form'),button=document.getElementById('login-button'),error=document.getElementById('login-error');
    const api=()=>String(window.COURSE_CONFIG?.apiBase||'').replace(/\/$/,'');
    const next=()=>{const raw=new URLSearchParams(location.search).get('next');if(!raw)return'catalog.html';try{const u=new URL(raw,location.href);return u.origin===location.origin&&u.pathname.startsWith(location.pathname.replace(/[^/]+$/,''))?u.href:'catalog.html'}catch{return'catalog.html'}};
    form.addEventListener('submit',async e=>{
      e.preventDefault();error.textContent='';
      const studentId=document.getElementById('student-id').value.trim();
      const name=document.getElementById('student-name').value.trim();
      const password=document.getElementById('login-password').value;
      if(!/^[0-9A-Za-z-]{4,24}$/.test(studentId)){error.textContent='学号/工号请输入 4–24 位字母、数字或短横线。';return}
      if(name.length<2||name.length>30){error.textContent='姓名请输入 2–30 个字符。';return}
      button.disabled=true;
      try{
        if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
        if(!api())throw Error('登录服务尚未加载，请刷新页面后重试。');
        const response=await fetch(api()+'/api/session/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId,name,password})});
        if(response.status===409)throw Error('该学生尚未注册，请先点击“注册账号”。');
        if(response.status===403)throw Error('学号/工号、姓名或密码不正确，请核对后重试。');
        if(!response.ok)throw Error('登录服务暂不可用，请稍后重试。');
        const data=await response.json();
        const record={studentId,name,sessionId:data.sessionId,token:data.token,demo:false};
        sessionStorage.removeItem('dg-teacher-preview');
        if(data.role==='teacher'){
          sessionStorage.removeItem('dg-study-session');
          sessionStorage.setItem('dg-teacher-session',JSON.stringify(record));
          location.href=data.mustChange?'teacher-password.html':'admin.html';
        }else{
          sessionStorage.removeItem('dg-teacher-session');
          sessionStorage.setItem('dg-study-session',JSON.stringify(record));
          location.href=next();
        }
      }catch(err){error.textContent=err instanceof TypeError?'无法连接登录服务，请检查网络后重试。':err.message||'登录失败，请稍后重试。';button.disabled=false}
    });
  })();
  </script>
</body>
</html>
