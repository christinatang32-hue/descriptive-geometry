<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改教师密码 · 画法几何及工程制图</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f3f7f6;color:#173240;font:15px/1.6 "Microsoft YaHei",sans-serif}
    main{width:min(100%,470px);padding:34px;background:white;border:1px solid #d9e3e0;border-radius:13px;box-shadow:0 14px 40px #16313c12}
    h1{margin:6px 0 8px;font-size:27px}p{color:#58707b}label{display:block;margin-top:16px;font-weight:700}input{display:block;width:100%;height:45px;margin-top:5px;padding:0 13px;border:1px solid #b9ceca;border-radius:7px;font:inherit}
    button{width:100%;height:46px;margin-top:24px;border:0;border-radius:7px;background:#0a7775;color:white;font:700 16px "Microsoft YaHei",sans-serif;cursor:pointer}button:disabled{opacity:.6}.error{min-height:22px;color:#ac3529}a{color:#0a7775;text-underline-offset:3px}
  </style>
  <script defer src="config.js"></script>
</head>
<body><main>
  <a href="index.html">← 返回登录</a>
  <h1>修改教师密码</h1>
  <p>首次登录请使用分发给你的初始密码，并设置自己的新密码。新密码至少 10 个字符。</p>
  <form id="password-form">
    <label for="current">当前密码<input id="current" type="password" autocomplete="current-password" required></label>
    <label for="next">新密码<input id="next" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
    <label for="confirm">再次输入新密码<input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
    <button id="submit" type="submit">保存新密码</button><p id="error" class="error" role="alert"></p>
  </form>
</main>
<script>
(()=>{
  let session;try{session=JSON.parse(sessionStorage.getItem('dg-teacher-session')||'null')}catch{}
  if(!session?.sessionId||!session?.token){location.replace('index.html');return}
  const $=id=>document.getElementById(id);
  $('password-form').addEventListener('submit',async event=>{
    event.preventDefault();$('error').textContent='';
    const currentPassword=$('current').value,newPassword=$('next').value,confirmPassword=$('confirm').value;
    if(newPassword!==confirmPassword){$('error').textContent='两次输入的新密码不一致。';return}
    if(newPassword.length<10){$('error').textContent='新密码至少需要 10 个字符。';return}
    $('submit').disabled=true;
    try{
      if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
      const api=String(window.COURSE_CONFIG?.apiBase||'').replace(/\/$/,'');
      if(!api)throw Error('服务尚未加载，请刷新后重试。');
      const response=await fetch(api+'/api/teacher/password/change',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.token,'X-Session-Id':session.sessionId},body:JSON.stringify({currentPassword,newPassword,confirmPassword})});
      if(response.status===401){sessionStorage.removeItem('dg-teacher-session');throw Error('登录已过期，请重新登录。')}
      if(response.status===403)throw Error('当前密码不正确。');
      if(!response.ok)throw Error('保存失败，请稍后重试。');
      location.replace('admin.html');
    }catch(cause){$('error').textContent=cause instanceof TypeError?'无法连接服务，请检查网络后重试。':cause.message||'保存失败。';$('submit').disabled=false}
  });
})();
</script>
</body></html>
